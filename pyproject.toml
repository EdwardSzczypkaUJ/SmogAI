[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gios-imgw-forecast-suite"
version = "1.7.0"
description = "Otwarta platforma godzinowych prognoz PM10, PM2.5, temperatury i opadu z DigitalOcean Spaces, FastAPI, Streamlit i wymiennymi modelami."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Edward Szczypka", email = "edward@szczypka.guru"}]
keywords = ["GIOŚ", "IMGW", "air-quality", "forecasting", "MLOps", "FastAPI", "Streamlit"]
dependencies = [
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "typer>=0.15,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0.2,<7",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "plotly>=5.24,<7",
  "pandera[pandas]>=0.32,<1",
  "boto3>=1.34,<2",
  "scipy>=1.14,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "pydeck>=0.9,<1",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.41,<2",
  "folium>=0.19,<1",
  "streamlit-folium>=0.24,<1",
]
observability = ["langfuse>=4,<5"]
mlops = ["mlflow>=3,<4"]
spaces = ["boto3>=1.34,<2"]
server = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
smog-ai = "smog_ai.cli:app"
smog-ai-server = "server.api.main:run"

[tool.setuptools.packages.find]
include = ["smog_ai*", "server*"]

[tool.setuptools.package-data]
smog_ai = ["resources/*.csv", "resources/*.json", "resources/*.geojson", "resources/docs/*.md", "resources/docs/*.tex"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra --strict-markers"
testpaths = ["tests", "server/tests"]
markers = ["integration: test requiring external services"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
  "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning:joblib.numpy_pickle",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
